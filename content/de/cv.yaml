welcome_heading: "Hallo! Ich bin Ludwig Loth, Informatiker aus Leidenschaft! "
work_status: angestellt
summary: |-
  <p data-pm-slice="1 1 []">Ich bin leidenschaftlicher Informatiker mit einem<strong> Master of Science in Angewandter Informatik</strong> und einem <strong>Bachelor of Science in Digitalen Medien </strong>(Medieninformatik). Diese Kombination sch&auml;rft meinen Blick f&uuml;r technische Details sowie die gesamte User-Experience und macht es mir m&ouml;glich, umfassend und ganzheitlich zu arbeiten. Mein beruflicher Weg f&uuml;hrte mich durch <strong>vielseitige Rollen als Softwareentwickler, wissenschaftlicher Mitarbeiter und Lehrbeauftragter</strong>. Dieses breite Spektrum aus Praxis, Theorie und Wissensvermittlung pr&auml;gt meine Arbeit bis heute.</p>
  <p data-pm-slice="1 1 []">&nbsp;</p>
  <p>Mit Begeisterung entwickle ich digitale Produkte und Konzepte, die technisch &uuml;berzeugen und im Alltag bestehen &ndash; dank hoher Gebrauchstauglichkeit, durchdachter Konzepte und ansprechender Gestaltung. Innovation bedeutet f&uuml;r mich, echten Mehrwert zu schaffen. Die Vermittlung von Wissen und F&auml;higkeiten ist ein zentraler Teil meiner Arbeit. Ich bringe Projekte gerne voran, entwickle neue Ideen und setze auf flexible Ans&auml;tze, die optimal zu den jeweiligen Teams und Aufgaben passen. Dabei profitiere ich von vielf&auml;ltigen Erfahrungen aus sozialen T&auml;tigkeiten und handwerklichen Bereichen, die meinen Blick erweitern und meine Arbeitsweise bereichern.</p>
  <p>&nbsp;</p>
  <p>F&uuml;r mich z&auml;hlt am Ende nicht nur, was m&ouml;glich ist, sondern vor allem, was sinnvoll ist. Gute Arbeit entsteht dort, wo Funktionalit&auml;t, Design und Usability einander erg&auml;nzen und st&auml;rken.</p>
  <p>&nbsp;</p>
  <p>Ich bin ein <strong>aufgeschlossener, lernwilliger und toleranter</strong> Mensch, bei dem Ausgrenzung keinen Platz hat. Diese Werte pr&auml;gen meinen Umgang mit Menschen und meine Zusammenarbeit in Teams.</p>
skills_summary: <p>In den vergangenen Jahren durfte ich in ganz unterschiedlichen Rollen, Projekten und Kontexten arbeiten und dabei enorm viel lernen. Ein gro&szlig;er Teil meines Wissens stammt aus Studium und Beruf, vieles habe ich mir aber auch autodidaktisch angeeignet. Neugier, Begeisterung und der Wunsch, Dinge wirklich zu verstehen, treiben mich dabei an. Ich erweitere mein Skillset kontinuierlich &ndash; immer auf der Suche nach Werkzeugen, Ideen und Techniken, die nicht nur spannend, sondern auch sinnvoll einsetzbar sind.</p>
stages_summary: |-
  <p>Hier finden Sie die wichtigsten Stationen meines bisherigen beruflichen und akademischen Werdegangs. Jede Einzelne hat mich gepr&auml;gt, mein Wissen erweitert und meine F&auml;higkeiten vertieft. Ich freue mich auf weitere spannende Herausforderungen, bei denen ich erneut dazulernen und mich weiterentwickeln kann.</p>
  <p>F&uuml;r einen ausf&uuml;hrlicheren Lebenslauf im PDF-Format (oder einem anderen gew&uuml;nschten Format) kontaktieren Sie mich gerne &uuml;ber einen der unten angegebenen Wege.</p>
