welcome_heading: Hello! I'm Ludwig Loth, a passionate computer scientist!
work_status: employed
summary: |-
  <p>I am a passionate computer scientist with a<strong> Master of Science in Applied Computer Science and a Bachelor of Science in Digital Media</strong> (Media Informatics). This combination sharpens my eye for technical details and the overall user experience, enabling me to work comprehensively and holistically. My professional career has taken me through a variety of roles as a software developer, research assistant, and lecturer. This broad spectrum of practice, theory, and knowledge transfer continues to shape my work today.</p>
  <p>&nbsp;</p>
  <p>I am enthusiastic about developing digital products and concepts that are technically impressive and stand up to everyday use&mdash;thanks to their high usability, well-thought-out concepts, and appealing design. For me, innovation means creating real added value. The transfer of knowledge and skills is a central part of my work. I enjoy driving projects forward, developing new ideas, and relying on flexible approaches that are optimally suited to the respective teams and tasks. In doing so, I benefit from a wide range of experiences from social activities and manual trades, which broaden my perspective and enrich my way of working.</p>
  <p>&nbsp;</p>
  <p>For me, what counts in the end is not only what is possible, but above all what makes sense. Good work is created where functionality, design, and usability complement and reinforce each other.</p>
  <p>&nbsp;</p>
  <p>I am an open-minded, eager to learn, and tolerant person who does not tolerate exclusion. These values shape my interactions with people and my collaboration in teams.</p>
skills_summary: <p>Over the past few years, I have had the opportunity to work in a wide variety of roles, projects, and contexts and have learned an enormous amount in the process. Much of my knowledge comes from my studies and professional experience, but I have also taught myself a great deal. Curiosity, enthusiasm, and the desire to truly understand things drive me forward. I am constantly expanding my skill set, always on the lookout for tools, ideas, and techniques that are not only exciting but also useful.</p>
stages_summary: |-
  <p>Here you will find the most important stages of my professional and academic career to date. Each one has shaped me, expanded my knowledge, and deepened my skills. I look forward to further exciting challenges where I can continue to learn and develop.</p>
  <p>For a more detailed resume in PDF format (or any other format you require), please contact me using one of the methods listed below.</p>
